<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Resumo de chamadas</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f17;
      --surface: #121826;
      --surface-2: #182033;
      --border: #25304a;
      --text: #e6edf6;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --accent-2: #6366f1;
      --danger: #ff7a90;
      --radius: 14px;
      --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(60rem 30rem at 85% -10%, rgba(99, 102, 241, 0.18), transparent 60%),
        radial-gradient(50rem 28rem at -10% 0%, rgba(34, 211, 238, 0.12), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    main { max-width: 76rem; margin: 0 auto; padding: 3rem 1rem 4rem; }

    header { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 2rem; }
    .logo {
      display: grid; place-items: center; flex: none;
      width: 2.75rem; height: 2.75rem; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #06101c;
    }
    h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.02em; }
    h3 { margin: 0; font-family: var(--mono); font-size: 1.05rem; color: var(--accent); }
    .subtitle { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .muted { color: var(--muted); font-size: 0.85rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    .card + .card { margin-top: 1rem; }
    .narrow { max-width: 42rem; margin-left: auto; margin-right: auto; }

    .status {
      display: flex; align-items: center; gap: 0.6rem;
      margin: 0 0 1rem; color: var(--muted); font-size: 0.875rem;
    }
    .spinner {
      width: 1rem; height: 1rem; border-radius: 50%;
      border: 2px solid var(--border); border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .dropzone {
      display: flex; flex-direction: column; align-items: center; gap: 0.35rem;
      padding: 2rem 1rem; text-align: center; cursor: pointer;
      border: 1.5px dashed var(--border); border-radius: var(--radius);
      background: var(--surface-2);
      transition: border-color 0.15s, background 0.15s;
    }
    .dropzone:hover, .dropzone.dragging { border-color: var(--accent); background: #1a2540; }
    .dropzone:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
    .dropzone.disabled { opacity: 0.5; cursor: not-allowed; }
    .dropzone svg { color: var(--accent); }
    .dropzone .title { font-weight: 600; }
    .dropzone .hint { color: var(--muted); font-size: 0.85rem; }
    .dropzone .picked { font-family: var(--mono); font-size: 0.85rem; color: var(--text); word-break: break-all; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }

    .actions { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; }
    .privacy { display: flex; align-items: center; gap: 0.45rem; margin: 0; color: var(--muted); font-size: 0.8rem; }

    button {
      font: inherit; font-weight: 600; cursor: pointer;
      border-radius: 10px; border: 1px solid transparent; padding: 0.6rem 1.4rem;
      transition: transform 0.1s, filter 0.15s, background 0.15s;
    }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #06101c; }
    .primary:hover:not(:disabled) { filter: brightness(1.1); }
    .primary:active:not(:disabled) { transform: translateY(1px); }
    .primary:disabled { background: var(--surface-2); color: var(--muted); border-color: var(--border); cursor: not-allowed; }
    .ghost { background: transparent; color: var(--text); border-color: var(--border); padding: 0.4rem 0.9rem; font-size: 0.85rem; }
    .ghost:hover { background: var(--surface-2); }

    .error {
      display: flex; gap: 0.6rem; align-items: center; margin: 1rem 0 0; padding: 0.8rem 1rem;
      border: 1px solid rgba(255, 122, 144, 0.4); background: rgba(255, 122, 144, 0.08);
      border-radius: 10px; color: var(--danger);
    }

    .tabs {
      display: inline-flex; gap: 0.25rem; padding: 0.25rem; margin-bottom: 1.25rem;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
    }
    .tab { background: transparent; color: var(--muted); padding: 0.45rem 1.1rem; border-radius: 9px; }
    .tab:hover { color: var(--text); }
    .tab[aria-selected="true"] { background: var(--surface); color: var(--text); border-color: var(--border); }

    .result-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; }
    .total-label { margin: 0; color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .total { margin: 0; font-family: var(--mono); font-size: 3rem; font-weight: 700; line-height: 1.1; letter-spacing: -0.03em; }

    .categories { list-style: none; margin: 1.25rem 0 0; padding: 0; display: grid; gap: 0.5rem; max-width: 36rem; }
    .category { display: grid; grid-template-columns: 2.25rem 1fr 3rem; align-items: center; gap: 0.75rem; }
    .letter {
      display: grid; place-items: center; height: 2.25rem; border-radius: 8px;
      background: var(--surface-2); border: 1px solid var(--border);
      font-family: var(--mono); font-weight: 700; color: var(--accent);
    }
    .bar { height: 0.55rem; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
    .bar > span {
      display: block; height: 100%; min-width: 4px; border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.5s ease;
    }
    .count { text-align: right; font-family: var(--mono); font-weight: 600; }

    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .toolbar .buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .vehicle { margin-top: 1.5rem; }
    .vehicle-head { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .vehicle-head .ghost { margin-left: auto; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th, td { padding: 0.5rem 0.6rem; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    th { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; background: var(--surface-2); white-space: nowrap; }
    td.time { font-family: var(--mono); white-space: nowrap; }
    td.address { min-width: 14rem; }
    td input {
      width: 100%; min-width: 5rem; font: inherit; color: var(--text);
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 0.35rem 0.6rem;
    }
    td input:hover { border-color: var(--muted); }
    td input.odometer { font-family: var(--mono); min-width: 5.5rem; }
    td input.driver { min-width: 9rem; }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
      .bar > span, button, .dropzone { transition: none; }
    }
    @media (max-width: 30rem) {
      main { padding-top: 1.5rem; }
      .total { font-size: 2.5rem; }
    }
    @media print {
      body { background: #fff; color: #000; }
      header, #upload-card, .tabs, .toolbar, #panel-summary, .vehicle-head .ghost { display: none !important; }
      #panel-vehicles { display: block !important; }
      .card { border: 0; box-shadow: none; background: none; padding: 0; }
      h3 { color: #000; }
      .vehicle { break-inside: avoid; }
      .table-wrap { border-color: #000; overflow: visible; }
      th, td { border-color: #000; background: none; color: #000; }
      td input { border: 0; background: none; color: #000; }
    }
  </style>
  <script
    src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"
    integrity="sha384-hYKrcQ7FiKU7f1c92md9N2eh7BoBVX4CPkNDfQyyVclsjZevvDOBUkajGcYk1EF8"
    crossorigin="anonymous"></script>
</head>
<body>
  <main>
    <header>
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
      </div>
      <div>
        <h1>Resumo de chamadas</h1>
        <p class="subtitle">Consolidado da planilha do CAD</p>
      </div>
    </header>

    <section id="upload-card" class="card narrow" aria-label="Envio da planilha">
      <p id="status" class="status" role="status"><span class="spinner" aria-hidden="true"></span>Preparando o Python no navegador (só na primeira vez)…</p>

      <label id="dropzone" class="dropzone disabled">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        <span class="title">Planilha do CAD (.csv)</span>
        <span id="picked" class="picked" hidden></span>
        <span id="hint" class="hint">Arraste o arquivo aqui ou clique para escolher</span>
        <input id="file" class="visually-hidden" type="file" accept=".csv" disabled>
      </label>

      <div class="actions">
        <p class="privacy">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          O arquivo é lido neste navegador e não é enviado a nenhum servidor.
        </p>
        <button id="ok" class="primary" type="button" disabled>OK</button>
      </div>

      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <section id="results" class="card" aria-label="Resultado" hidden>
      <div class="tabs" role="tablist" aria-label="Visões do resultado">
        <button id="tab-summary" class="tab" type="button" role="tab" aria-controls="panel-summary" aria-selected="true">Resumo</button>
        <button id="tab-vehicles" class="tab" type="button" role="tab" aria-controls="panel-vehicles" aria-selected="false" tabindex="-1">Viaturas</button>
      </div>

      <div id="panel-summary" role="tabpanel" aria-labelledby="tab-summary">
        <p id="summary-error" class="error" role="alert" hidden></p>
        <div id="summary-content">
          <div class="result-head">
            <div>
              <p class="total-label">Total</p>
              <p id="total" class="total"></p>
            </div>
            <button id="copy" class="ghost" type="button" data-label="Copiar resumo">Copiar resumo</button>
          </div>
          <ul id="categories" class="categories"></ul>
        </div>
      </div>

      <div id="panel-vehicles" role="tabpanel" aria-labelledby="tab-vehicles" hidden>
        <p id="vehicles-error" class="error" role="alert" hidden></p>
        <div id="vehicles-content">
          <div class="toolbar">
            <span id="vehicles-count" class="muted"></span>
            <div class="buttons">
              <button id="copy-all" class="ghost" type="button" data-label="Copiar tudo">Copiar tudo</button>
              <button id="export-csv" class="ghost" type="button">Exportar CSV</button>
              <button id="print" class="ghost" type="button">Imprimir</button>
            </div>
          </div>
          <div id="vehicles"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const MODULES = ["csv_reader", "count", "vehicles"];
    const TABLE_HEADERS = ["Hora saída", "Hora chegada", "Od. saída", "Od. chegada", "Endereço", "Motorista"];

    const status = document.getElementById("status");
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("file");
    const picked = document.getElementById("picked");
    const hint = document.getElementById("hint");
    const okButton = document.getElementById("ok");
    const error = document.getElementById("error");
    const results = document.getElementById("results");
    const tabs = [...document.querySelectorAll(".tab")];
    const summaryError = document.getElementById("summary-error");
    const summaryContent = document.getElementById("summary-content");
    const totalOutput = document.getElementById("total");
    const categoriesOutput = document.getElementById("categories");
    const copyButton = document.getElementById("copy");
    const vehiclesError = document.getElementById("vehicles-error");
    const vehiclesContent = document.getElementById("vehicles-content");
    const vehiclesCount = document.getElementById("vehicles-count");
    const vehiclesOutput = document.getElementById("vehicles");

    let lastText = "";
    let vehiclesState = [];

    async function loadSummary() {
      const pyodide = await loadPyodide();
      pyodide.FS.mkdirTree("/home/pyodide/summary");
      await Promise.all(MODULES.map(async (name) => {
        const response = await fetch(`summary/${name}.py`);
        if (!response.ok) throw new Error(`summary/${name}.py: ${response.status}`);
        pyodide.FS.writeFile(`/home/pyodide/summary/${name}.py`, await response.text());
      }));
      pyodide.runPython(`
from summary.count import count_calls, format_summary
from summary.vehicles import group_by_vehicle


def summarize(content):
    try:
        total, categories = count_calls(bytes(content.to_py()))
    except KeyError as error:
        return {"missing_column": error.args[0]}
    return {
        "text": format_summary(total, categories),
        "total": total,
        "categories": list(categories.items()),
    }


def list_vehicles(content):
    try:
        grouped = group_by_vehicle(bytes(content.to_py()))
    except KeyError as error:
        return {"missing_column": error.args[0]}
    return {
        "vehicles": [
            {
                "vehicle": vehicle,
                "trips": [[trip.departure, trip.arrival, trip.address] for trip in trips],
            }
            for vehicle, trips in grouped.items()
        ]
    }
`);
      return {
        summarize: pyodide.globals.get("summarize"),
        listVehicles: pyodide.globals.get("list_vehicles"),
      };
    }

    const summaryReady = loadSummary();

    summaryReady.then(() => {
      status.hidden = true;
      fileInput.disabled = false;
      dropzone.classList.remove("disabled");
    }).catch((failure) => {
      status.textContent = "Não foi possível carregar o Python no navegador.";
      console.error(failure);
    });

    function toJs(proxy) {
      const value = proxy.toJs({ dict_converter: Object.fromEntries });
      proxy.destroy();
      return value;
    }

    function formatSize(bytes) {
      return bytes < 1024 * 1024
        ? `${Math.max(1, Math.round(bytes / 1024))} KB`
        : `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function flash(button, message) {
      button.textContent = message;
      setTimeout(() => { button.textContent = button.dataset.label; }, 1800);
    }

    async function copyText(button, text) {
      try {
        await navigator.clipboard.writeText(text);
        flash(button, "Copiado");
      } catch {
        flash(button, "Não foi possível copiar");
      }
    }

    function selectTab(name) {
      for (const tab of tabs) {
        const selected = tab.id === `tab-${name}`;
        tab.setAttribute("aria-selected", selected);
        tab.tabIndex = selected ? 0 : -1;
        document.getElementById(tab.getAttribute("aria-controls")).hidden = !selected;
      }
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener("click", () => selectTab(tab.id.replace("tab-", "")));
      tab.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        const next = tabs[(index + (event.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length];
        next.focus();
        next.click();
      });
    });

    function resetOutput() {
      error.hidden = true;
      results.hidden = true;
    }

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      okButton.disabled = !file;
      resetOutput();
      picked.hidden = !file;
      if (file) {
        picked.textContent = `${file.name} · ${formatSize(file.size)}`;
        hint.textContent = "Clique para trocar o arquivo";
      }
    });

    for (const eventName of ["dragenter", "dragover"]) {
      dropzone.addEventListener(eventName, (event) => {
        event.preventDefault();
        if (!fileInput.disabled) dropzone.classList.add("dragging");
      });
    }
    for (const eventName of ["dragleave", "drop"]) {
      dropzone.addEventListener(eventName, () => dropzone.classList.remove("dragging"));
    }
    dropzone.addEventListener("drop", (event) => {
      event.preventDefault();
      const file = event.dataTransfer.files[0];
      if (fileInput.disabled || !file || !file.name.toLowerCase().endsWith(".csv")) return;
      const transfer = new DataTransfer();
      transfer.items.add(file);
      fileInput.files = transfer.files;
      fileInput.dispatchEvent(new Event("change"));
    });

    function renderSummary(summary) {
      summaryError.hidden = true;
      summaryContent.hidden = false;
      lastText = summary.text;
      totalOutput.textContent = summary.total;
      categoriesOutput.replaceChildren(...summary.categories.map(([letter, amount]) => {
        const item = document.createElement("li");
        item.className = "category";
        item.setAttribute("aria-label", `${letter} - ${amount}`);
        item.innerHTML = '<span class="letter"></span><span class="bar"><span></span></span><span class="count"></span>';
        item.querySelector(".letter").textContent = letter;
        item.querySelector(".count").textContent = amount;
        item.querySelector(".bar > span").style.width = `${(amount / summary.total) * 100}%`;
        return item;
      }));
    }

    function toTableRows(vehicles, withVehicle) {
      const header = withVehicle ? ["Viatura", ...TABLE_HEADERS] : TABLE_HEADERS;
      const body = vehicles.flatMap(({ vehicle, trips }) => trips.map((trip) => {
        const cells = [trip.departure, trip.arrival, trip.odometerOut, trip.odometerIn, trip.address, trip.driver];
        return withVehicle ? [vehicle, ...cells] : cells;
      }));
      return [header, ...body];
    }

    function toTsv(rows) {
      return rows.map((row) => row.map((cell) => cell.replace(/[\t\r\n]+/g, " ")).join("\t")).join("\n");
    }

    function toCsv(rows) {
      const field = (cell) => (/[";\r\n]/.test(cell) ? `"${cell.replaceAll('"', '""')}"` : cell);
      return rows.map((row) => row.map(field).join(";")).join("\r\n");
    }

    function buildInput(trip, key, label, className, inputMode) {
      const input = document.createElement("input");
      input.type = "text";
      input.className = className;
      input.value = trip[key];
      input.autocomplete = "off";
      if (inputMode) input.inputMode = inputMode;
      input.setAttribute("aria-label", label);
      input.addEventListener("input", () => { trip[key] = input.value; });
      return input;
    }

    function buildCell(className, content) {
      const cell = document.createElement("td");
      if (className) cell.className = className;
      cell.append(content);
      return cell;
    }

    function buildVehicle(group) {
      const section = document.createElement("section");
      section.className = "vehicle";
      section.innerHTML = '<div class="vehicle-head"><h3></h3><span class="muted"></span><button class="ghost" type="button" data-label="Copiar">Copiar</button></div>'
        + '<div class="table-wrap"><table><thead><tr></tr></thead><tbody></tbody></table></div>';
      section.querySelector("h3").textContent = group.vehicle;
      section.querySelector(".muted").textContent = group.trips.length === 1 ? "1 atendimento" : `${group.trips.length} atendimentos`;
      section.querySelector("button").addEventListener("click", (event) => {
        copyText(event.currentTarget, toTsv(toTableRows([group], false)));
      });
      section.querySelector("thead tr").replaceChildren(...TABLE_HEADERS.map((title) => {
        const header = document.createElement("th");
        header.scope = "col";
        header.textContent = title;
        return header;
      }));
      section.querySelector("tbody").replaceChildren(...group.trips.map((trip) => {
        const context = `${group.vehicle}, ${trip.departure}`;
        const row = document.createElement("tr");
        row.append(
          buildCell("time", trip.departure),
          buildCell("time", trip.arrival),
          buildCell("", buildInput(trip, "odometerOut", `Od. saída, ${context}`, "odometer", "numeric")),
          buildCell("", buildInput(trip, "odometerIn", `Od. chegada, ${context}`, "odometer", "numeric")),
          buildCell("address", trip.address),
          buildCell("", buildInput(trip, "driver", `Motorista, ${context}`, "driver")),
        );
        return row;
      }));
      return section;
    }

    function renderVehicles(data) {
      vehiclesError.hidden = true;
      vehiclesContent.hidden = false;
      vehiclesState = data.vehicles.map(({ vehicle, trips }) => ({
        vehicle,
        trips: trips.map(([departure, arrival, address]) => (
          { departure, arrival, address, odometerOut: "", odometerIn: "", driver: "" }
        )),
      }));
      const tripCount = vehiclesState.reduce((sum, group) => sum + group.trips.length, 0);
      vehiclesCount.textContent = vehiclesState.length === 0
        ? "Nenhuma chamada com viatura nesta planilha."
        : `${vehiclesState.length} ${vehiclesState.length === 1 ? "viatura" : "viaturas"} · ${tripCount} atendimentos`;
      vehiclesOutput.replaceChildren(...vehiclesState.map(buildVehicle));
    }

    function showMissingColumn(errorElement, contentElement, column) {
      errorElement.textContent = `Coluna ${column} não encontrada.`;
      errorElement.hidden = false;
      contentElement.hidden = true;
    }

    okButton.addEventListener("click", async () => {
      resetOutput();
      try {
        const { summarize, listVehicles } = await summaryReady;
        const content = new Uint8Array(await fileInput.files[0].arrayBuffer());
        const summary = toJs(summarize(content));
        const vehicles = toJs(listVehicles(content));
        if (summary.missing_column) {
          showMissingColumn(summaryError, summaryContent, summary.missing_column);
        } else {
          renderSummary(summary);
        }
        if (vehicles.missing_column) {
          showMissingColumn(vehiclesError, vehiclesContent, vehicles.missing_column);
        } else {
          renderVehicles(vehicles);
        }
        results.hidden = false;
        selectTab("summary");
      } catch (failure) {
        console.error(failure);
        error.textContent = "Não foi possível processar a planilha.";
        error.hidden = false;
      }
    });

    copyButton.addEventListener("click", () => copyText(copyButton, lastText));
    document.getElementById("copy-all").addEventListener("click", (event) => {
      copyText(event.currentTarget, toTsv(toTableRows(vehiclesState, true)));
    });
    document.getElementById("export-csv").addEventListener("click", () => {
      const file = new Blob(["﻿", toCsv(toTableRows(vehiclesState, true))], { type: "text/csv;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(file);
      link.download = "viaturas.csv";
      link.click();
      URL.revokeObjectURL(link.href);
    });
    document.getElementById("print").addEventListener("click", () => window.print());
  </script>
</body>
</html>
