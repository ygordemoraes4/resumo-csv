<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resumo de chamadas</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    pre { padding: 1rem; border-radius: 0.5rem; background: color-mix(in srgb, currentColor 8%, transparent); }
    .error { color: #b00020; }
  </style>
  <script
    src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"
    integrity="sha384-hYKrcQ7FiKU7f1c92md9N2eh7BoBVX4CPkNDfQyyVclsjZevvDOBUkajGcYk1EF8"
    crossorigin="anonymous"></script>
</head>
<body>
  <h1>Resumo de chamadas</h1>
  <p id="status">Carregando...</p>
  <label>Planilha do CAD (.csv) <input id="file" type="file" accept=".csv" disabled></label>
  <button id="ok" disabled>OK</button>
  <p id="error" class="error" hidden></p>
  <pre id="result" hidden></pre>

  <script>
    const status = document.getElementById("status");
    const fileInput = document.getElementById("file");
    const okButton = document.getElementById("ok");
    const error = document.getElementById("error");
    const result = document.getElementById("result");

    async function loadSummary() {
      const pyodide = await loadPyodide();
      const source = await (await fetch("summary/count.py")).text();
      pyodide.FS.mkdirTree("/home/pyodide/summary");
      pyodide.FS.writeFile("/home/pyodide/summary/count.py", source);
      pyodide.runPython(`
from summary.count import NATURE_COLUMN, count_calls, format_summary


def summarize(content):
    try:
        total, categories = count_calls(bytes(content.to_py()))
    except KeyError:
        return None
    return format_summary(total, categories)
`);
      return {
        summarize: pyodide.globals.get("summarize"),
        natureColumn: pyodide.globals.get("NATURE_COLUMN"),
      };
    }

    const summaryReady = loadSummary();

    summaryReady.then(() => {
      status.hidden = true;
      fileInput.disabled = false;
    }).catch((failure) => {
      status.textContent = "Não foi possível carregar o Python no navegador.";
      console.error(failure);
    });

    fileInput.addEventListener("change", () => {
      okButton.disabled = fileInput.files.length === 0;
    });

    okButton.addEventListener("click", async () => {
      const { summarize, natureColumn } = await summaryReady;
      const content = new Uint8Array(await fileInput.files[0].arrayBuffer());
      const text = summarize(content);
      error.hidden = text !== undefined;
      result.hidden = text === undefined;
      if (text === undefined) {
        error.textContent = `Coluna ${natureColumn} não encontrada.`;
      } else {
        result.textContent = text;
      }
    });
  </script>
</body>
</html>
